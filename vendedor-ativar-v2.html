<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#087a4b"><title>PMG Comercial IA • Ativação</title><script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script><style>:root{--g:#087a4b;--gd:#075b3c;--gs:#eaf7ef;--r:#ff2c32;--bg:#f5f8f6;--i:#172019;--m:#718078;--l:#dfe8e2}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#eef7f1,#f9fbfa);color:var(--i);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}.wrap{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}.brandpanel{background:linear-gradient(145deg,#087a4b,#07583b);color:#fff;padding:9vw 7vw;position:relative;overflow:hidden}.brandpanel:after{content:"";position:absolute;right:-90px;bottom:-100px;width:330px;height:300px;background:linear-gradient(135deg,transparent 51%,#fff 51% 55%,var(--r) 55%)}.logo{width:78px;height:78px}.logo svg{width:100%;height:100%}.brandpanel h1{font-size:45px;line-height:1.05;margin:28px 0 10px;max-width:520px}.brandpanel p{font-size:18px;color:#d5ecde;line-height:1.55;max-width:520px}.formwrap{display:grid;place-items:center;padding:24px}.card{width:min(450px,100%);background:#fff;border:1px solid var(--l);border-radius:28px;padding:28px;box-shadow:0 22px 55px rgba(10,70,45,.08)}.ey{font-size:10px;text-transform:uppercase;letter-spacing:.14em;font-weight:900;color:#6a8774}.card h2{font-size:31px;margin:8px 0}.card p{color:var(--m);line-height:1.5}.field{display:grid;gap:7px;margin:12px 0}.field label{font-size:11px;font-weight:850}.field input{width:100%;border:1px solid var(--l);border-radius:13px;padding:13px;font:inherit}.btn{width:100%;border:0;border-radius:13px;padding:13px;font:inherit;font-weight:900;background:linear-gradient(90deg,#09934f,var(--g));color:#fff;cursor:pointer;display:flex;gap:8px;align-items:center;justify-content:center}.msg{margin-top:11px;padding:11px;border-radius:12px;background:#f0f4f1;color:var(--m);font-size:11px}.err{background:#fff0f1;color:#a51c28}.ok{background:#e7f8ef;color:#087447}@media(max-width:780px){.wrap{grid-template-columns:1fr}.brandpanel{padding:32px 24px 70px}.brandpanel h1{font-size:34px}.brandpanel p{font-size:14px}.logo{width:62px;height:62px}.formwrap{padding:18px}.card{margin-top:-48px;position:relative;z-index:2}}</style></head><body><main class="wrap"><section class="brandpanel"><div class="logo" data-logo></div><h1>PMG Comercial IA</h1><p>Seu acesso comercial individual: clientes, IA, pedidos, CRM, comissão e WhatsApp em um só lugar.</p></section><section class="formwrap"><div class="card"><div class="ey">Primeiro acesso</div><h2>Crie sua senha</h2><p>Este convite é individual. Depois da ativação você entra direto no Portal do Vendedor V2.</p><div class="field"><label>Nova senha</label><input id="password" type="password" placeholder="Mínimo de 8 caracteres"></div><div class="field"><label>Confirmar senha</label><input id="confirm" type="password" placeholder="Repita a senha"></div><button id="activate" class="btn"><i data-lucide="shield-check" style="width:20px"></i>Ativar meu acesso</button><div id="msg" class="msg" style="display:none"></div></div></section></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.0';const U='https://mvlnnerolwabvdgbpntz.supabase.co',K='sb_publishable_oS7vr5cb4w5TQJaiZ0jJ9w_IX9Q21SY',ACT=U+'/functions/v1/pmg-seller-activate',sb=createClient(U,K),$=x=>document.getElementById(x),token=new URLSearchParams(location.search).get('invite'),logo=`<svg viewBox="0 0 100 100"><rect x="2" y="2" width="96" height="96" rx="18" fill="#fff" stroke="#111" stroke-width="1.4"/><path d="M5 5h72L5 77z" fill="#ff2c32"/><path d="M95 95H25l70-70z" fill="#008846"/><path d="M2 83L83 2l15 15-81 81z" fill="#fff"/><text x="17" y="78" font-size="23" font-weight="900" font-family="Arial" transform="rotate(-45 17 78)">P</text><text x="47" y="53" font-size="23" font-weight="900" font-family="Arial" transform="rotate(-45 47 53)">M</text><text x="73" y="27" font-size="20" font-weight="900" font-family="Arial" transform="rotate(-45 73 27)">G</text></svg>`;document.querySelectorAll('[data-logo]').forEach(x=>x.innerHTML=logo);function show(t,c=''){const m=$('msg');m.style.display='block';m.className='msg '+c;m.textContent=t}if(!token)show('Convite não informado ou link incompleto.','err');$('activate').onclick=async()=>{const p=$('password').value,c=$('confirm').value;if(!token)return show('Convite não informado.','err');if(p.length<8)return show('Use pelo menos 8 caracteres.','err');if(p!==c)return show('As senhas não conferem.','err');$('activate').disabled=true;try{const r=await fetch(ACT,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token,password:p})}),j=await r.json();if(!r.ok)throw new Error(j.error||'activation_failed');const{data,error}=await sb.auth.signInWithPassword({email:j.email,password:p});if(error)throw error;show('Acesso ativado. Abrindo seu portal...','ok');setTimeout(()=>location.href='vendedor-v2.html',700)}catch(e){show('Não foi possível ativar: '+e.message,'err');$('activate').disabled=false}};lucide.createIcons();</script></body></html>
