<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1d6b45"><title>PMG • Corrigir Pedido</title><style>:root{--bg:#f5f7f4;--card:#fff;--ink:#172019;--muted:#6b756e;--line:#e1e7e2;--green:#1c7048;--green2:#e8f5ed;--orange:#9a5a11;--red:#ad2530}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}button,input{font:inherit}.wrap{max-width:950px;margin:auto;padding:22px 16px 70px}.head{display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:10px;align-items:center;font-weight:900}.logo{width:43px;height:43px;border-radius:14px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:12px}.back{color:var(--green);font-weight:850;text-decoration:none}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:13px}.notice{background:#fff4e8;color:#86520e;border-radius:13px;padding:12px;font-size:12px;line-height:1.5}.items{display:grid;gap:9px;margin-top:13px}.item{border:1px solid var(--line);border-radius:15px;padding:13px}.row{display:flex;justify-content:space-between;gap:10px}.code{display:inline-flex;padding:5px 8px;border-radius:999px;background:var(--green2);color:var(--green);font-size:10px;font-weight:900}.item h3{font-size:14px;margin:8px 0 4px;line-height:1.35}.meta{font-size:10px;color:var(--muted)}.edit{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:10px}.edit input{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px}.btn{border:0;border-radius:12px;padding:10px 12px;font-weight:900;cursor:pointer}.green{background:var(--green);color:#fff}.soft{background:var(--green2);color:var(--green)}.remove{background:#fff0f1;color:#a51c28}.totals{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:14px;margin-top:14px}.totals strong{font-size:23px}.msg{margin-top:11px;padding:11px 13px;border-radius:12px;background:#eef3ef;color:var(--muted);font-size:11px}.ok{background:#e7f8ef;color:#087447}.err{background:#fff0f1;color:#a51c28}@media(max-width:650px){.edit{grid-template-columns:1fr 1fr}.edit .remove{grid-column:1/-1}.row{flex-direction:column}}</style></head><body><main class="wrap"><header class="head"><div class="brand"><div class="logo">PMG</div><div>PMG Comercial IA<div style="font-size:11px;color:var(--muted);font-weight:600">Correção do pedido</div></div></div><a id="back" class="back" href="pedidos-v3.html">← Pedido</a></header><section id="main" class="card">Carregando...</section></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.0';const sb=createClient('https://mvlnnerolwabvdgbpntz.supabase.co','sb_publishable_oS7vr5cb4w5TQJaiZ0jJ9w_IX9Q21SY');const $=x=>document.getElementById(x);const id=new URLSearchParams(location.search).get('id');const money=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(n||0));const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let order,customer,items=[],validation;async function boot(){const{data:{session}}=await sb.auth.getSession();if(!session){location.href='pedidos-v3.html';return}if(!id){$('main').textContent='Pedido não informado.';return}const{data:o,error}=await sb.from('orders').select('*').eq('id',id).single();if(error||o.status!=='draft'){$('main').textContent='Este pedido não está disponível para correção.';return}order=o;const[{data:c},{data:i},{data:v}]=await Promise.all([sb.from('customers').select('*').eq('id',o.customer_id).single(),sb.from('order_items').select('*').eq('order_id',id).order('created_at'),sb.from('order_customer_validations').select('*').eq('order_id',id).order('created_at',{ascending:false}).limit(1)]);customer=c;items=(i||[]).map(x=>({product_id:x.product_id,product_code:x.product_code_snapshot,product_name:x.product_name_snapshot,sale_unit:x.sale_unit_snapshot,quantity:Number(x.quantity),discount_pct:Number(x.seller_discount_pct),effective_price:Number(x.final_unit_price)/(1-Number(x.seller_discount_pct||0)/100),max_discount_pct:100}));validation=v?.[0];$('back').href='pedido-v3.html?id='+id;render()}function render(){const note=validation?.status==='revision_requested'?validation.revision_message:'';$('main').innerHTML=`<div style="font-size:10px;text-transform:uppercase;letter-spacing:.12em;font-weight:900;color:#68806f">Pedido #${order.order_number}</div><h1 style="font-size:27px;margin:6px 0">Corrigir pedido de ${esc(customer?.trade_name||customer?.legal_name||'Cliente')}</h1>${note?`<div class="notice"><strong>O cliente pediu:</strong> ${esc(note)}</div>`:''}<div id="items" class="items"></div><div class="totals"><div><span style="color:var(--muted);font-size:11px">Total estimado após correção</span><strong id="total" style="display:block">R$ 0,00</strong></div><div style="text-align:right"><button id="add" class="btn soft">+ Adicionar produto</button><button id="save" class="btn green">Salvar correção</button></div></div><div id="msg" class="msg" style="display:none"></div>`;drawItems()}function drawItems(){const box=$('items');box.innerHTML='';items.forEach((it,i)=>{const d=document.createElement('div');d.className='item';d.innerHTML=`<div class="row"><div><span class="code">Cód. ${esc(it.product_code)}</span><h3>${esc(it.product_name)}</h3><div class="meta">${esc(it.sale_unit||'')} • <button class="btn soft change" style="padding:5px 7px">Trocar produto</button></div></div><div style="font-weight:900">${money(it.effective_price)}</div></div><div class="edit"><input class="qty" type="number" min="0.001" step="0.001" value="${it.quantity}" placeholder="Quantidade"><input class="disc" type="number" min="0" step="0.01" value="${it.discount_pct}" placeholder="Desconto %"><button class="btn remove">Remover</button></div>`;box.appendChild(d);d.querySelector('.qty').oninput=e=>{it.quantity=Number(e.target.value||0);recalc()};d.querySelector('.disc').oninput=e=>{it.discount_pct=Math.max(0,Number(e.target.value||0));recalc()};d.querySelector('.remove').onclick=()=>{items.splice(i,1);drawItems()};d.querySelector('.change').onclick=()=>chooseProduct(i)}) ;recalc();document.getElementById('add').onclick=()=>chooseProduct(-1);document.getElementById('save').onclick=save}async function chooseProduct(index){const q=prompt('Digite o código ou nome do produto:');if(!q)return;const{data,error}=await sb.rpc('search_products_for_order',{p_customer_id:order.customer_id,p_query:q,p_limit:8});if(error||!data?.length){alert('Nenhum produto encontrado.');return}const text=data.map((x,n)=>`${n+1}. ${x.product_code} — ${x.product_name} — ${money(x.effective_price)}`).join('\n');const choice=Number(prompt('Escolha:\n'+text))-1;if(choice<0||!data[choice])return;const x=data[choice],obj={product_id:x.product_id,product_code:x.product_code,product_name:x.product_name,sale_unit:x.sale_unit,quantity:index>=0?items[index].quantity:1,discount_pct:0,effective_price:Number(x.effective_price),max_discount_pct:Number(x.max_discount_pct||0)};if(index>=0)items[index]=obj;else items.push(obj);drawItems()}function recalc(){const total=items.reduce((s,x)=>s+(Number(x.effective_price||0)*(1-Number(x.discount_pct||0)/100)*Number(x.quantity||0)),0);const e=document.getElementById('total');if(e)e.textContent=money(total)}async function save(){const m=document.getElementById('msg');if(!items.length){m.style.display='block';m.className='msg err';m.textContent='O pedido precisa ter pelo menos um item.';return}const payload=items.filter(x=>x.quantity>0).map(x=>({product_id:x.product_id,quantity:Number(x.quantity),discount_pct:Number(x.discount_pct||0)}));const{error}=await sb.rpc('replace_order_from_cart',{p_order_id:id,p_items:payload});m.style.display='block';if(error){m.className='msg err';m.textContent='Não foi possível corrigir: '+error.message;return}m.className='msg ok';m.textContent='Pedido corrigido. Preços, descontos e comissão foram revalidados no servidor. Agora envie uma nova validação ao cliente.';setTimeout(()=>location.href='pedido-v3.html?id='+id,1100)}boot();</script></body></html>
