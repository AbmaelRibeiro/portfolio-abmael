;align-items:center;justify-content:center;gap:7px;cursor:pointer;text-decoration:none}.pri{background:#fff;color:var(--gd)}.soft{background:var(--gs);color:var(--gd)}.blue{background:#edf3ff;color:var(--blue)}.orange{background:#fff3df;color:#8b5611}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.toolbar input,.toolbar select{border:1px solid var(--l);background:#fff;border-radius:13px;padding:11px 12px;min-height:42px}.toolbar input{flex:1;min-width:200px}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.metric,.order{background:#fff;border:1px solid var(--l);border-radius:17px;padding:13px}.metric small{display:block;color:var(--m);font-size:9px}.metric strong{display:block;font-size:20px;margin-top:4px}.list{display:grid;gap:9px;margin-top:14px}.orderTop{display:flex;justify-content:space-between;gap:12px}.status{display:inline-flex;padding:5px 8px;border-radius:99px;font-size:9px;font-weight:900;background:#eff3f0}.status.sent{background:#edf3ff;color:#315d91}.status.approved{background:var(--gs);color:var(--g)}.status.launching{background:#fff3df;color:#8b5611}.status.finalized{background:#e5f5ea;color:#17633d}.order h3{font-size:13px;margin:6px 0 4px}.meta{font-size:9px;color:var(--m);line-height:1.5}.amount{text-align:right;font-weight:950;font-size:18px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;border-top:1px solid var(--l);padding-top:10px}.revision{background:#fff4e8;color:#88530d;border-radius:11px;padding:9px 10px;margin-top:9px;font-size:10px}.msg{margin-top:10px;padding:10px 12px;border-radius:11px;background:#f0f4f1;color:var(--m);font-size:10px}.ok{background:#e7f8ef;color:#087447}.err{background:#fff0f1;color:#a51c28}.empty{padding:22px;border:1px dashed #cfdcd4;border-radius:15px;color:var(--m);font-size:11px;text-align:center;background:#fbfdfb}.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(1050px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:rgba(6,91,60,.98);padding:7px 4px calc(7px + env(safe-area-inset-bottom));z-index:30}.nav button{border:0;background:transparent;color:#cfe7d8;padding:5px 2px;font-size:9px;font-weight:800;border-radius:11px}.nav .ico{display:block;margin:0 auto 3px}.nav .active{color:#fff;background:rgba(255,255,255,.12)}.login{max-width:430px;margin:12vh auto}.lc{background:#fff;border:1px solid var(--l);border-radius:24px;padding:24px}@media(max-width:800px){.metrics{grid-template-columns:repeat(2,1fr)}.orderTop{flex-direction:column}.amount{text-align:left}.hero h1{font-size:26px}}</style></head><body><section id="login" class="login hidden"><div class="lc"><div class="brand"><div class="logo" data-logo></div><div><strong>PMG Comercial IA</strong><small>Meus pedidos</small></div></div><div class="toolbar" style="display:grid"><input id="email" type="email" placeholder="E-mail"><input id="password" type="password" placeholder="Senha"><button id="loginBtn" class="btn soft">Entrar</button></div><div id="loginMsg" class="msg hidden"></div></div></section><main id="app" class="shell hidden"><header class="top"><div class="brand"><div class="logo" data-logo></div><div><strong>PMG Comercial IA</strong><small id="profile">Pedidos do vendedor</small></div></div><button class="back" onclick="location.href='vendedor-v2.html'"><i data-lucide="arrow-left" class="ico"></i></button></header><div class="main"><section class="hero"><div class="ey">Do rascunho à venda</div><h1>Meus pedidos</h1><p>Acompanhe o que está em rascunho, aguardando o cliente, aprovado ou em lançamento.</p><div class="acts"><a class="btn pri" href="vendedor-ia-v2.html"><i data-lucide="sparkles" class="ico"></i>Criar com IA</a><a class="btn pri" href="vendedor.html#pedido"><i data-lucide="plus" class="ico"></i>Pedido manual</a></div></section><div class="toolbar"><input id="search" placeholder="Buscar pedido ou cliente"><select id="filter"><option value="">Todos os status</option><option value="draft">Rascunho</option><option value="sent">Aguardando cliente</option><option value="approved">Aprovado</option><option value="launching">Em lançamento</option><option value="finalized">Finalizado</option></select><button id="refresh" class="btn soft"><i data-lucide="refresh-cw" class="ico"></i>Atualizar</button></div><section class="metrics"><div class="metric"><small>Rascunhos</small><strong id="mDraft">0</strong></div><div class="metric"><small>Aguardando cliente</small><strong id="mSent">0</strong></div><div class="metric"><small>Aprovados</small><strong id="mApproved">0</strong></div><div class="metric"><small>Em lançamento</small><strong id="mLaunching">0</strong></div><div class="metric"><small>Finalizados</small><strong id="mFinalized">0</strong></div></section><div id="globalMsg" class="msg hidden"></div><section id="orders" class="list"></section></div><nav class="nav"><button onclick="location.href='vendedor-v2.html'"><i data-lucide="house" class="ico"></i>Início</button><button onclick="location.href='vendedor-ia-v2.html'"><i data-lucide="sparkles" class="ico"></i>IA</button><button onclick="location.href='comercial-v2.html#kanban'"><i data-lucide="columns-3" class="ico"></i>CRM</button><button class="active"><i data-lucide="shopping-cart" class="ico"></i>Pedidos</button><button onclick="location.href='whatsapp-v2.html'"><i data-lucide="message-circle" class="ico"></i>WhatsApp</button></nav></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.0';const U='https://mvlnnerolwabvdgbpntz.supabase.co',K='sb_publishable_oS7vr5cb4w5TQJaiZ0jJ9w_IX9Q21SY',sb=createClient(U,K),$=x=>document.getElementById(x),VALIDATION_BASE='https://raw.githack.com/AbmaelRibeiro/portfolio-abmael/pmg-homologacao/pedido-validar.html?token=';let orders=[],customers={},validations={};const money=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(n||0)),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),labels={draft:'Rascunho',sent:'Aguardando cliente',approved:'Aprovado pelo cliente',launching:'Em lançamento',finalized:'Finalizado',cancelled:'Cancelado'},logo=`<svg viewBox="0 0 100 100"><rect x="2" y="2" width="96" height="96" rx="18" fill="#fff" stroke="#111" stroke-width="1.4"/><path d="M5 5h72L5 77z" fill="#ff2c32"/><path d="M95 95H25l70-70z" fill="#008846"/><path d="M2 83L83 2l15 15-81 81z" fill="#fff"/><text x="17" y="78" font-size="23" font-weight="900" font-family="Arial" transform="rotate(-45 17 78)">P</text><text x="47" y="53" font-size="23" font-weight="900" font-family="Arial" transform="rotate(-45 47 53)">M</text><text x="73" y="27" font-size="20" font-weight="900" font-family="Arial" transform="rotate(-45 73 27)">G</text></svg>`;document.querySelectorAll('[data-logo]').forEach(x=>x.innerHTML=logo);const icons=()=>lucide?.createIcons(),msg=(t,c='')=>{const e=$('globalMsg');e.textContent=t;e.className='msg '+c};async function boot(){const{data:{session}}=await sb.auth.getSession();if(!session){$('login').classList.remove('hidden');icons();return}const{data:p}=await sb.from('profiles').select('role,active').eq('id',session.user.id).single();if(!p||p.role!=='seller'||!p.active){await sb.auth.signOut();$('login').classList.remove('hidden');return}const{data:v}=await sb.from('sellers').select('display_name,seller_code').eq('user_id',session.user.id).single();$('profile').textContent=(v?.display_name||'Vendedor')+' • '+(v?.seller_code||'');$('app').classList.remove('hidden');await load();icons()}async function load(){const[{data:o,error},{data:c},{data:v}]=await Promise.all([sb.from('orders').select('*').order('created_at',{ascending:false}),sb.from('customers').select('id,trade_name,legal_name,whatsapp_phone,phone'),sb.from('order_customer_validations').select('*').order('created_at',{ascending:false})]);if(error)return msg(error.message,'err');orders=o||[];customers=Object.fromEntries((c||[]).map(x=>[x.id,x]));validations={};for(const x of v||[]){if(!validations[x.order_id])validations[x.order_id]=x}render();icons()}function render(){const q=$('search').value.toLowerCase().trim(),f=$('filter').value;for(const st of ['draft','sent','approved','launching','finalized'])$('m'+st[0].toUpperCase()+st.slice(1)).textContent=orders.filter(o=>o.status===st).length;const filtered=orders.filter(o=>{const cn=customers[o.customer_id]?.trade_name||customers[o.customer_id]?.legal_name||'';return(!f||o.status===f)&&(!q||String(o.order_number).includes(q)||cn.toLowerCase().includes(q))});$('orders').innerHTML='';if(!filtered.length){$('orders').innerHTML='<div class="empty">Nenhum pedido encontrado.</div>';return}for(const o of filtered){const c=customers[o.customer_id]||{},v=validations[o.id],needsFix=v?.status==='revision_requested';let actions=`<a class="btn soft" href="pedido-v3.html?id=${o.id}">Ver pedido</a>`;if(o.status==='draft'&&o.customer_validation_required)actions+=needsFix?`<a class="btn orange" href="corrigir-pedido.html?id=${o.id}">Corrigir pedido</a>`:`<button class="btn soft validate" data-id="${o.id}">Enviar para validar</button>`;if(o.status==='sent')actions+=`<button class="btn blue validate" data-id="${o.id}">Gerar novo link</button>`;if(['approved','launching'].includes(o.status))actions+=`<a class="btn orange" href="lancamento-v2.html?id=${o.id}">Modo lançamento PMG</a>`;const d=document.createElement('article');d.className='order';d.innerHTML=`<div class="orderTop"><div><span class="status ${o.status}">${labels[o.status]||o.status}</span><h3>Pedido #${o.order_number} • ${esc(c.trade_name||c.legal_name||'Cliente')}</h3><div class="meta">${new Date(o.created_at).toLocaleDateString('pt-BR')} • Comissão prevista ${money(o.commission_forecast)}</div></div><div class="amount">${money(o.net_amount)}</div></div>${needsFix?`<div class="revision"><strong>Cliente pediu correção:</strong> ${esc(v.revision_message||'Sem observação.')}</div>`:''}<div class="actions">${actions}</div>`;$('orders').appendChild(d)}$('orders').querySelectorAll('.validate').forEach(b=>b.onclick=()=>sendValidation(b.dataset.id))}async function sendValidation(id){const{data:token,error}=await sb.rpc('create_order_validation',{p_order_id:id,p_valid_hours:48});if(error)return msg('Não foi possível gerar a validação: '+error.message,'err');const url=VALIDATION_BASE+encodeURIComponent(token);await navigator.clipboard.writeText(url);const o=orders.find(x=>x.id===id),c=customers[o.customer_id]||{};msg('Link de validação criado e copiado.','ok');const phone=String(c.whatsapp_phone||c.phone||'').replace(/\D/g,'');if(phone){const text=`Olá! Seu pedido #${o.order_number} está pronto para conferência. Valide produtos, quantidades e valores: ${url}`;window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(text),'_blank')}setTimeout(load,600)}$('search').oninput=render;$('filter').onchange=render;$('refresh').onclick=load;$('loginBtn').onclick=async()=>{const{data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim().toLowerCase(),password:$('password').value});if(error){$('loginMsg').textContent='E-mail ou senha inválidos.';$('loginMsg').className='msg err';return}location.reload()};boot();icons();</script></body></html>
