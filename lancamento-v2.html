<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1d6b45"><title>PMG • Modo Lançamento</title><style>:root{--bg:#f3f7f4;--card:#fff;--ink:#162019;--muted:#68736b;--line:#dfe7e1;--green:#1c7048;--green2:#e7f5ed;--orange:#a55e12}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}.wrap{max-width:850px;margin:auto;padding:22px 16px 70px}.brand{display:flex;gap:10px;align-items:center;font-weight:900}.logo{width:43px;height:43px;border-radius:14px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:12px}.head{display:flex;justify-content:space-between;align-items:center}.head a{color:var(--green);font-weight:850;text-decoration:none}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;margin-top:15px;box-shadow:0 10px 30px rgba(25,75,48,.06)}.progress{height:8px;background:#e6ece8;border-radius:999px;overflow:hidden;margin:13px 0}.bar{height:100%;background:var(--green);width:0}.step{font-size:11px;color:var(--muted)}.codeWrap{text-align:center;background:#f4f8f5;border-radius:18px;padding:22px;margin:15px 0}.codeWrap small{display:block;color:var(--muted);font-size:11px}.code{font-size:48px;font-weight:950;letter-spacing:.04em;color:var(--green);margin:8px 0}.product{font-size:20px;font-weight:900;line-height:1.35}.details{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}.detail{background:#f7f9f7;border-radius:14px;padding:13px}.detail small{display:block;color:var(--muted);font-size:10px}.detail strong{display:block;font-size:18px;margin-top:4px}.actions{display:flex;gap:8px;justify-content:space-between;margin-top:15px}.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:900;cursor:pointer}.green{background:var(--green);color:#fff}.soft{background:var(--green2);color:var(--green)}.orange{background:#fff3df;color:#8f5712}.finalBox{display:none}.field{margin-top:12px}.field input{width:100%;border:1px solid var(--line);border-radius:13px;padding:12px}.msg{padding:11px 13px;border-radius:12px;background:#edf3ef;color:var(--muted);font-size:11px;margin-top:10px}.err{background:#fff0f1;color:#a51c28}.ok{background:#e7f8ef;color:#087447}@media(max-width:650px){.code{font-size:39px}.details{grid-template-columns:1fr}.actions{flex-wrap:wrap}.btn{flex:1}}</style></head><body><main class="wrap"><header class="head"><div class="brand"><div class="logo">PMG</div><div>PMG Comercial IA<div style="font-size:11px;color:var(--muted);font-weight:600">Modo lançamento</div></div></div><a id="back" href="pedidos-v3.html">← Pedidos</a></header><section id="card" class="card">Carregando pedido...</section></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.0';const sb=createClient('https://mvlnnerolwabvdgbpntz.supabase.co','sb_publishable_oS7vr5cb4w5TQJaiZ0jJ9w_IX9Q21SY');const id=new URLSearchParams(location.search).get('id');const $=x=>document.getElementById(x);const money=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(n||0));const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let order,items=[],idx=0;async function boot(){const{data:{session}}=await sb.auth.getSession();if(!session){location.href='pedidos-v3.html';return}if(!id){$('card').textContent='Pedido não informado.';return}let{data:o,error}=await sb.from('orders').select('*').eq('id',id).single();if(error){$('card').textContent='Pedido não encontrado.';return}order=o;if(order.status==='approved'){const{error:e}=await sb.rpc('start_order_launch',{p_order_id:id});if(e){$('card').innerHTML='<div class="msg err">Não foi possível iniciar: '+esc(e.message)+'</div>';return}const r=await sb.from('orders').select('*').eq('id',id).single();order=r.data}if(order.status!=='launching'){if(order.status==='finalized'){$('card').innerHTML='<h2>Pedido já finalizado.</h2><a href="pedido-v3.html?id='+id+'">Ver pedido</a>';return}$('card').innerHTML='<div class="msg err">Este pedido ainda não está aprovado pelo cliente para lançamento.</div>';return}const{data:i}=await sb.from('order_items').select('*').eq('order_id',id).order('created_at');items=i||[];$('back').href='pedido-v3.html?id='+id;render()}function render(){const c=$('card');if(!items.length){c.textContent='Pedido sem itens.';return}if(idx>=items.length){renderFinish();return}const it=items[idx],pct=Math.round(((idx+1)/items.length)*100);c.innerHTML=`<div class="step">Pedido #${order.order_number} • Item ${idx+1} de ${items.length}</div><div class="progress"><div class="bar" style="width:${pct}%"></div></div><div class="codeWrap"><small>CÓDIGO PMG</small><div class="code">${esc(it.product_code_snapshot)}</div><div class="product">${esc(it.product_name_snapshot)}</div></div><div class="details"><div class="detail"><small>Quantidade</small><strong>${Number(it.quantity).toLocaleString('pt-BR')} ${esc(it.sale_unit_snapshot||'')}</strong></div><div class="detail"><small>Preço unitário</small><strong>${money(it.final_unit_price)}</strong></div><div class="detail"><small>Subtotal</small><strong>${money(it.line_total)}</strong></div></div><div class="actions"><button id="prev" class="btn soft" ${idx===0?'disabled':''}>← Anterior</button><button id="copy" class="btn green">Copiar código</button><button id="next" class="btn orange">${idx===items.length-1?'Concluir itens':'Próximo →'}</button></div><div id="msg" class="msg" style="display:none"></div>`;document.getElementById('prev').onclick=()=>{idx--;render()};document.getElementById('next').onclick=()=>{idx++;render()};document.getElementById('copy').onclick=async()=>{await navigator.clipboard.writeText(it.product_code_snapshot);const m=document.getElementById('msg');m.style.display='block';m.className='msg ok';m.textContent='Código '+it.product_code_snapshot+' copiado.'}}function renderFinish(){const c=$('card');c.innerHTML=`<div class="step">Pedido #${order.order_number} • Todos os itens revisados</div><h2 style="font-size:27px;margin:8px 0">Lançamento concluído?</h2><p style="color:var(--muted);line-height:1.5">Confirme somente depois de lançar todos os códigos, quantidades e preços no sistema oficial da PMG.</p><div class="field"><label style="font-size:11px;font-weight:800;color:var(--muted)">Nº / referência do pedido no sistema PMG (opcional)</label><input id="ref" placeholder="Ex.: 458721"></div><div class="details"><div class="detail"><small>Total</small><strong>${money(order.net_amount)}</strong></div><div class="detail"><small>Comissão</small><strong>${money(order.commission_forecast)}</strong></div><div class="detail"><small>Itens</small><strong>${items.length}</strong></div></div><div class="actions"><button id="again" class="btn soft">← Rever itens</button><button id="finalize" class="btn green">✓ Finalizar venda</button></div><div id="msg" class="msg" style="display:none"></div>`;document.getElementById('again').onclick=()=>{idx=0;render()};document.getElementById('finalize').onclick=finish}async function finish(){const b=document.getElementById('finalize'),m=document.getElementById('msg');b.disabled=true;b.textContent='Finalizando...';const ref=document.getElementById('ref').value.trim();if(ref){const{error:e}=await sb.from('orders').update({external_reference:ref,updated_at:new Date().toISOString()}).eq('id',id);if(e){m.style.display='block';m.className='msg err';m.textContent='Não foi possível salvar a referência: '+e.message;b.disabled=false;b.textContent='✓ Finalizar venda';return}}const{error}=await sb.rpc('finalize_order',{p_order_id:id});m.style.display='block';if(error){m.className='msg err';m.textContent='Não foi possível finalizar: '+error.message;b.disabled=false;b.textContent='✓ Finalizar venda';return}m.className='msg ok';m.textContent='Venda finalizada. A comissão foi confirmada e o CRM movido para Fechado.';b.textContent='Finalizado ✓';setTimeout(()=>location.href='pedido-v3.html?id='+id,1200)}boot();</script></body></html>
