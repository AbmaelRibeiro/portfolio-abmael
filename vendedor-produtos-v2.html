<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#087a4b"><title>PMG Comercial IA • Produtos</title><script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script><style>:root{--g:#087a4b;--gd:#075b3c;--gs:#eaf7ef;--r:#ff2c32;--bg:#f5f8f6;--i:#172019;--m:#718078;--l:#dfe8e2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--i);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}.hidden{display:none!important}.ico{width:20px;height:20px}.shell{max-width:1050px;margin:auto;padding-bottom:88px}.top{height:75px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:rgba(245,248,246,.95);backdrop-filter:blur(16px);z-index:20}.brand{display:flex;align-items:center;gap:11px}.logo{width:50px;height:50px}.logo svg{width:100%;height:100%}.brand small{display:block;color:var(--m);margin-top:2px}.back{width:42px;height:42px;border:1px solid var(--l);background:#fff;border-radius:13px;color:var(--g);display:grid;place-items:center}.main{padding:0 14px 24px}.hero{background:linear-gradient(135deg,#0a7447,#07583b);color:#fff;border-radius:25px;padding:22px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;right:-70px;bottom:-95px;width:250px;height:220px;background:linear-gradient(135deg,transparent 51%,#fff 51% 55%,var(--r) 55%)}.ey{font-size:10px;text-transform:uppercase;letter-spacing:.14em;font-weight:900;color:#6a8774}.hero .ey{color:#9ee0b8}.hero h1{font-size:30px;margin:7px 0 8px;position:relative;z-index:2}.hero p{color:#d9f0e2;line-height:1.5;max-width:680px;position:relative;z-index:2}.card{background:#fff;border:1px solid var(--l);border-radius:18px;padding:14px}.toolbar{display:grid;grid-template-columns:1fr 1.4fr auto;gap:8px;margin:14px 0}.toolbar select,.toolbar input{border:1px solid var(--l);border-radius:13px;padding:11px;background:#fff}.btn{border:0;border-radius:13px;padding:11px 13px;font-weight:850;display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer}.pri{background:linear-gradient(90deg,#09934f,var(--g));color:#fff}.soft{background:var(--gs);color:var(--gd)}.section{margin:18px 0}.section h2{font-size:21px;margin:4px 0 10px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.product{background:#fff;border:1px solid var(--l);border-radius:16px;padding:13px}.code{display:inline-flex;padding:4px 7px;border-radius:99px;background:var(--gs);color:var(--g);font-size:9px;font-weight:900}.promo{display:inline-flex;margin-left:5px;padding:4px 7px;border-radius:99px;background:#fff1d9;color:#8b5611;font-size:9px;font-weight:900}.product h3{font-size:13px;line-height:1.35;margin:8px 0 5px}.meta{font-size:9px;color:var(--m);line-height:1.5}.price{font-size:20px;font-weight:950;margin-top:8px;color:var(--gd)}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.empty{padding:20px;border:1px dashed #cfdcd4;border-radius:15px;color:var(--m);font-size:11px;text-align:center;background:#fbfdfb}.msg{margin-top:9px;padding:10px;border-radius:11px;background:#f0f4f1;color:var(--m);font-size:10px}.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(1050px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:rgba(6,91,60,.98);padding:7px 4px calc(7px + env(safe-area-inset-bottom));z-index:30}.nav button{border:0;background:transparent;color:#cfe7d8;padding:5px 2px;font-size:9px;font-weight:800;border-radius:11px}.nav .ico{display:block;margin:0 auto 3px}.login{max-width:430px;margin:12vh auto}.lc{background:#fff;border:1px solid var(--l);border-radius:24px;padding:24px}@media(max-width:760px){.toolbar{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.hero h1{font-size:26px}}</style></head><body><section id="login" class="login hidden"><div class="lc"><div class="brand"><div class="logo" data-logo></div><div><strong>PMG Comercial IA</strong><small>Produtos</small></div></div><div class="toolbar" style="grid-template-columns:1fr"><input id="email" placeholder="E-mail"><input id="password" type="password" placeholder="Senha"><button id="loginBtn" class="btn pri">Entrar</button></div></div></section><main id="app" class="shell hidden"><header class="top"><div class="brand"><div class="logo" data-logo></div><div><strong>PMG Comercial IA</strong><small id="profile">Catálogo do vendedor</small></div></div><button class="back" onclick="location.href='vendedor-v2.html'"><i data-lucide="arrow-left" class="ico"></i></button></header><div class="main"><section class="hero"><div class="ey">Catálogo inteligente</div><h1>Produto certo, preço certo para o cliente.</h1><p>Busque pelo código PMG, nome ou marca. O preço já considera a tabela do cliente e ofertas ativas.</p></section><div class="toolbar"><select id="customer"><option value="">Selecione o cliente</option></select><input id="query" placeholder="Código, produto ou marca"><button id="searchBtn" class="btn pri"><i data-lucide="search" class="ico"></i>Buscar</button></div><div id="msg" class="msg hidden"></div><section class="section"><div class="ey">Histórico do cliente</div><h2>Comprados recentemente</h2><div id="recent" class="grid"></div></section><section class="section"><div class="ey">Catálogo</div><h2>Resultados</h2><div id="results" class="grid"></div></section></div><nav class="nav"><button onclick="location.href='vendedor-v2.html'"><i data-lucide="house" class="ico"></i>Início</button><button onclick="location.href='vendedor-ia-v2.html'"><i data-lucide="sparkles" class="ico"></i>IA</button><button onclick="location.href='vendedor-crm-v2.html'"><i data-lucide="columns-3" class="ico"></i>CRM</button><button onclick="location.href='vendedor-pedidos-v2.html'"><i data-lucide="shopping-cart" class="ico"></i>Pedidos</button><button onclick="location.href='vendedor-whatsapp-v2.html'"><i data-lucide="message-circle" class="ico"></i>WhatsApp</button></nav></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.0';const U='https://mvlnnerolwabvdgbpntz.supabase.co',K='sb_publishable_oS7vr5cb4w5TQJaiZ0jJ9w_IX9Q21SY',sb=createClient(U,K),$=x=>document.getElementById(x),money=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(n||0)),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),logo=`<svg viewBox="0 0 100 100"><rect x="2" y="2" width="96" height="96" rx="18" fill="#fff" stroke="#111" stroke-width="1.4"/><path d="M5 5h72L5 77z" fill="#ff2c32"/><path d="M95 95H25l70-70z" fill="#008846"/><path d="M2 83L83 2l15 15-81 81z" fill="#fff"/><text x="17" y="78" font-size="23" font-weight="900" font-family="Arial" transform="rotate(-45 17 78)">P</text><text x="47" y="53" font-size="23" font-weight="900" font-family="Arial" transform="rotate(-45 47 53)">M</text><text x="73" y="27" font-size="20" font-weight="900" font-family="Arial" transform="rotate(-45 73 27)">G</text></svg>`;document.querySelectorAll('[data-logo]').forEach(x=>x.innerHTML=logo);const icons=()=>lucide?.createIcons();async function boot(){const{data:{session}}=await sb.auth.getSession();if(!session){$('login').classList.remove('hidden');icons();return}const{data:p}=await sb.from('profiles').select('role,active').eq('id',session.user.id).single();if(!p||p.role!=='seller'||!p.active){await sb.auth.signOut();$('login').classList.remove('hidden');return}const{data:v}=await sb.from('sellers').select('display_name,seller_code').eq('user_id',session.user.id).single();$('profile').textContent=(v?.display_name||'Vendedor')+' • '+(v?.seller_code||'');$('app').classList.remove('hidden');const{data:c}=await sb.from('customers').select('id,trade_name,legal_name,city').eq('active',true).order('trade_name');for(const x of c||[]){const o=document.createElement('option');o.value=x.id;o.textContent=(x.trade_name||x.legal_name||'Cliente')+(x.city?' • '+x.city:'');$('customer').appendChild(o)}icons()}function productCard(p){return `<article class="product"><span class="code">Cód. ${esc(p.product_code)}</span>${p.official_offer_id?'<span class="promo">OFERTA</span>':''}<h3>${esc(p.product_name)}</h3><div class="meta">Venda por ${esc(p.sale_unit||'—')} • Tabela ${esc(p.price_table_code||'')}<br>Desconto máx. ${Number(p.max_discount_pct||0).toFixed(2)}% • Comissão ${Number(p.commission_rate_pct||0).toFixed(2)}%</div><div class="price">${money(p.effective_price)}</div>${p.official_offer_title?`<div class="meta">${esc(p.official_offer_title)}</div>`:''}<div class="actions"><button class="btn soft copy" data-code="${esc(p.product_code)}">Copiar código</button><button class="btn soft ai" data-name="${esc(p.product_name)}">Usar na IA</button></div></article>`}async function search(){const cid=$('customer').value;if(!cid){$('msg').textContent='Selecione um cliente.';$('msg').className='msg';return}const{data,error}=await sb.rpc('search_products_for_order',{p_customer_id:cid,p_query:$('query').value.trim(),p_limit:40});$('results').innerHTML=error?'<div class="empty">Erro ao buscar.</div>':(data||[]).map(productCard).join('')||'<div class="empty">Nenhum produto encontrado.</div>';bind();await recent()}async function recent(){const cid=$('customer').value;if(!cid)return $('recent').innerHTML='<div class="empty">Selecione um cliente para ver o histórico.</div>';const{data:o}=await sb.from('orders').select('id').eq('customer_id',cid).order('created_at',{ascending:false}).limit(5);const ids=(o||[]).map(x=>x.id);if(!ids.length)return $('recent').innerHTML='<div class="empty">Sem compras anteriores.</div>';const{data:i}=await sb.from('order_items').select('product_id,product_code_snapshot,product_name_snapshot,sale_unit_snapshot,final_unit_price').in('order_id',ids);const seen=new Set(),items=[];for(const x of i||[]){if(seen.has(x.product_id))continue;seen.add(x.product_id);items.push(x)}$('recent').innerHTML=items.slice(0,6).map(x=>`<article class="product"><span class="code">Cód. ${esc(x.product_code_snapshot)}</span><h3>${esc(x.product_name_snapshot)}</h3><div class="meta">Último preço registrado</div><div class="price">${money(x.final_unit_price)}</div><div class="actions"><button class="btn soft copy" data-code="${esc(x.product_code_snapshot)}">Copiar código</button></div></article>`).join('')||'<div class="empty">Sem itens recentes.</div>';bind()}function bind(){document.querySelectorAll('.copy').forEach(b=>b.onclick=async()=>{await navigator.clipboard.writeText(b.dataset.code);b.textContent='Copiado ✓'});document.querySelectorAll('.ai').forEach(b=>b.onclick=()=>location.href='vendedor-ia-v2.html')} $('searchBtn').onclick=search;$('customer').onchange=recent;$('query').addEventListener('keydown',e=>{if(e.key==='Enter')search()});$('loginBtn').onclick=async()=>{const{error}=await sb.auth.signInWithPassword({email:$('email').value.trim().toLowerCase(),password:$('password').value});if(!error)location.reload()};boot();icons();</script></body></html>
