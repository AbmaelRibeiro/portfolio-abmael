<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#087a4b"><title>PMG Comercial IA • Pedido</title><script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script><style>:root{--g:#087a4b;--gd:#075b3c;--gs:#eaf7ef;--r:#ff2c32;--bg:#f5f8f6;--i:#172019;--m:#718078;--l:#dfe8e2;--blue:#315d91;--orange:#9a5a11}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--i);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.ico{width:20px;height:20px}.shell{max-width:1050px;margin:auto;padding-bottom:88px}.top{height:75px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:rgba(245,248,246,.95);backdrop-filter:blur(16px);z-index:20}.brand{display:flex;align-items:center;gap:11px}.logo{width:50px;height:50px}.logo svg{width:100%;height:100%}.brand small{display:block;color:var(--m);margin-top:2px}.back{width:42px;height:42px;border:1px solid var(--l);background:#fff;border-radius:13px;color:var(--g);display:grid;place-items:center}.main{padding:0 14px 24px}.hero,.card{background:#fff;border:1px solid var(--l);border-radius:19px;padding:16px}.hero{margin-top:4px;display:flex;justify-content:space-between;gap:16px}.hero h1{font-size:30px;margin:7px 0}.ey{font-size:10px;text-transform:uppercase;letter-spacing:.14em;font-weight:900;color:#6a8774}.meta{font-size:10px;color:var(--m);line-height:1.55}.amount{text-align:right}.amount strong{display:block;font-size:28px}.status{display:inline-flex;padding:5px 8px;border-radius:99px;font-size:9px;font-weight:900;background:#eff3f0}.status.sent{background:#edf3ff;color:var(--blue)}.status.approved,.status.finalized{background:var(--gs);color:var(--g)}.status.launching{background:#fff3df;color:#8d5811}.revision{margin-top:10px;background:#fff4e7;color:#87520d;border-radius:13px;padding:11px;font-size:11px;line-height:1.45}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:13px;padding:11px 13px;font-weight:850;display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;text-decoration:none}.pri{background:linear-gradient(90deg,#09934f,var(--g));color:#fff}.soft{background:var(--gs);color:var(--gd)}.blue{background:#edf3ff;color:var(--blue)}.orange{background:#fff3df;color:#8d5811}.grid{display:grid;grid-template-columns:1.3fr .7fr;gap:12px;margin-top:12px}.items,.timeline{display:grid;gap:8px}.item{border:1px solid var(--l);border-radius:14px;padding:12px}.row{display:flex;justify-content:space-between;gap:10px}.code{display:inline-flex;padding:4px 7px;border-radius:99px;background:var(--gs);color:var(--g);font-size:9px;font-weight:900}.item h3{font-size:12px;margin:7px 0 4px}.price{font-weight:950}.summary{display:grid;gap:8px}.sum{background:#f6f9f7;border-radius:13px;padding:11px}.sum small{display:block;color:var(--m);font-size:9px}.sum strong{display:block;font-size:19px;margin-top:3px}.event{border-left:3px solid #d6e3da;padding:4px 0 4px 10px}.event strong{font-size:11px}.event span{display:block;color:var(--m);font-size:9px;margin-top:2px}.msg{padding:10px 12px;border-radius:12px;background:#f0f4f1;color:var(--m);font-size:10px;margin-top:9px}.ok{background:#e7f8ef;color:#087447}.err{background:#fff0f1;color:#a51c28}.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(1050px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:rgba(6,91,60,.98);padding:7px 4px calc(7px + env(safe-area-inset-bottom));z-index:30}.nav button{border:0;background:transparent;color:#cfe7d8;padding:5px 2px;font-size:9px;font-weight:800;border-radius:11px}.nav .ico{display:block;margin:0 auto 3px}.nav .active{color:#fff;background:rgba(255,255,255,.12)}@media(max-width:760px){.grid{grid-template-columns:1fr}.hero{flex-direction:column}.amount{text-align:left}.hero h1{font-size:26px}}</style></head><body><main class="shell"><header class="top"><div class="brand"><div class="logo" data-logo></div><div><strong>PMG Comercial IA</strong><small>Detalhe do pedido</small></div></div><button class="back" onclick="location.href='vendedor-pedidos-v2.html'"><i data-lucide="arrow-left" class="ico"></i></button></header><div class="main"><section id="hero" class="hero">Carregando...</section><div id="revision"></div><div id="actions" class="actions"></div><div id="msg" class="msg" style="display:none"></div><section class="grid"><div class="card"><div class="ey">Itens do pedido</div><div id="items" class="items" style="margin-top:10px"></div></div><aside class="summary"><div class="sum"><small>Bruto</small><strong id="gross">R$ 0,00</strong></div><div class="sum"><small>Desconto</small><strong id="discount">R$ 0,00</strong></div><div class="sum"><small>Total</small><strong id="net">R$ 0,00</strong></div><div class="sum"><small>Comissão prevista</small><strong id="commission" style="color:var(--g)">R$ 0,00</strong></div><div class="card"><div class="ey">Histórico</div><div id="history" class="timeline" style="margin-top:10px"></div></div></aside></section></div><nav class="nav"><button onclick="location.href='vendedor-v2.html'"><i data-lucide="house" class="ico"></i>Início</button><button onclick="location.href='vendedor-ia-v2.html'"><i data-lucide="sparkles" class="ico"></i>IA</button><button onclick="location.href='vendedor-crm-v2.html'"><i data-lucide="columns-3" class="ico"></i>CRM</button><button class="active" onclick="location.href='vendedor-pedidos-v2.html'"><i data-lucide="shopping-cart" class="ico"></i>Pedidos</button><button onclick="location.href='vendedor-whatsapp-v2.html'"><i data-lucide="message-circle" class="ico"></i>WhatsApp</button></nav></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.0';const U='https://mvlnnerolwabvdgbpntz.supabase.co',K='sb_publishable_oS7vr5cb4w5TQJaiZ0jJ9w_IX9Q21SY',sb=createClient(U,K),$=x=>document.getElementById(x),id=new URLSearchParams(location.search).get('id'),BASE='https://raw.githack.com/AbmaelRibeiro/portfolio-abmael/pmg-homologacao/pedido-validar.html?token=',money=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(n||0)),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),labels={draft:'Rascunho',sent:'Aguardando cliente',approved:'Aprovado pelo cliente',launching:'Em lançamento',finalized:'Finalizado',cancelled:'Cancelado'},logo=`<svg viewBox="0 0 100 100"><rect x="2" y="2" width="96" height="96" rx="18" fill="#fff" stroke="#111" stroke-width="1.4"/><path d="M5 5h72L5 77z" fill="#ff2c32"/><path d="M95 95H25l70-70z" fill="#008846"/><path d="M2 83L83 2l15 15-81 81z" fill="#fff"/><text x="17" y="78" font-size="23" font-weight="900" font-family="Arial" transform="rotate(-45 17 78)">P</text><text x="47" y="53" font-size="23" font-weight="900" font-family="Arial" transform="rotate(-45 47 53)">M</text><text x="73" y="27" font-size="20" font-weight="900" font-family="Arial" transform="rotate(-45 73 27)">G</text></svg>`;document.querySelectorAll('[data-logo]').forEach(x=>x.innerHTML=logo);let order,customer,items=[],validation,history=[];const icons=()=>lucide?.createIcons();async function boot(){const{data:{session}}=await sb.auth.getSession();if(!session)return location.href='vendedor-v2.html';if(!id)return $('hero').textContent='Pedido não informado.';const{data:o,error}=await sb.from('orders').select('*').eq('id',id).single();if(error)return $('hero').textContent='Pedido não encontrado.';order=o;const[{data:c},{data:i},{data:v},{data:h}]=await Promise.all([sb.from('customers').select('trade_name,legal_name,whatsapp_phone,phone').eq('id',o.customer_id).single(),sb.from('order_items').select('*').eq('order_id',id).order('created_at'),sb.from('order_customer_validations').select('*').eq('order_id',id).order('created_at',{ascending:false}).limit(1),sb.from('order_status_history').select('*').eq('order_id',id).order('created_at',{ascending:false})]);customer=c;items=i||[];validation=v?.[0];history=h||[];render()}function render(){const cname=customer?.trade_name||customer?.legal_name||'Cliente';$('hero').innerHTML=`<div><span class="status ${order.status}">${labels[order.status]||order.status}</span><h1>Pedido #${order.order_number}</h1><div class="meta">Cliente: <strong>${esc(cname)}</strong><br>Criado em ${new Date(order.created_at).toLocaleString('pt-BR')}${order.external_reference?'<br>Referência PMG: <strong>'+esc(order.external_reference)+'</strong>':''}</div></div><div class="amount"><span class="meta">Total</span><strong>${money(order.net_amount)}</strong></div>`;$('revision').innerHTML=validation?.status==='revision_requested'?`<div class="revision"><strong>Cliente pediu correção:</strong><br>${esc(validation.revision_message||'Sem observação.')}</div>`:'';let a=`<a class="btn soft" href="vendedor-ia-v2.html"><i data-lucide="sparkles" class="ico"></i>Abrir IA</a>`;if(order.status==='draft'&&order.customer_validation_required)a+=validation?.status==='revision_requested'?`<a class="btn orange" href="vendedor-corrigir-pedido-v2.html?id=${id}"><i data-lucide="pencil" class="ico"></i>Corrigir pedido</a>`:`<button id="validate" class="btn pri"><i data-lucide="send" class="ico"></i>Enviar para cliente validar</button>`;if(order.status==='sent')a+=`<button id="validate" class="btn blue"><i data-lucide="link" class="ico"></i>Gerar novo link</button>`;if(['approved','launching'].includes(order.status))a+=`<a class="btn orange" href="vendedor-lancamento-v2.html?id=${id}"><i data-lucide="clipboard-check" class="ico"></i>Modo lançamento PMG</a>`;$('actions').innerHTML=a;$('items').innerHTML=items.map(it=>`<div class="item"><div class="row"><div><span class="code">Cód. ${esc(it.product_code_snapshot)}</span><h3>${esc(it.product_name_snapshot)}</h3><div class="meta">Qtd. ${Number(it.quantity).toLocaleString('pt-BR')} ${esc(it.sale_unit_snapshot||'')} • Unitário ${money(it.final_unit_price)}${Number(it.seller_discount_pct)>0?' • Desc. '+Number(it.seller_discount_pct).toFixed(2)+'%':''}</div></div><div class="price">${money(it.line_total)}</div></div></div>`).join('');$('gross').textContent=money(order.gross_amount);$('discount').textContent=money(order.discount_amount);$('net').textContent=money(order.net_amount);$('commission').textContent=money(order.commission_forecast);$('history').innerHTML=history.map(h=>`<div class="event"><strong>${labels[h.to_status]||h.to_status}</strong><span>${new Date(h.created_at).toLocaleString('pt-BR')}${h.note?' • '+esc(h.note):''}</span></div>`).join('')||'<div class="meta">Sem movimentações registradas.</div>';document.getElementById('validate')?.addEventListener('click',sendValidation);icons()}async function sendValidation(){const b=document.getElementById('validate');b.disabled=true;const{data:token,error}=await sb.rpc('create_order_validation',{p_order_id:id,p_valid_hours:48});const m=$('msg');m.style.display='block';if(error){m.className='msg err';m.textContent='Não foi possível gerar o link: '+error.message;b.disabled=false;return}const url=BASE+encodeURIComponent(token);await navigator.clipboard.writeText(url);m.className='msg ok';m.textContent='Link de validação criado e copiado. O cliente poderá aprovar ou solicitar correção.';const phone=String(customer?.whatsapp_phone||customer?.phone||'').replace(/\D/g,'');if(phone){const text=`Olá! Seu pedido #${order.order_number} está pronto para conferência. Valide produtos, quantidades e valores: ${url}`;window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(text),'_blank')}setTimeout(()=>location.reload(),900)}boot();icons();</script></body></html>
