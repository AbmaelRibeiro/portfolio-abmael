ow('As senhas não conferem.','err');$('activate').disabled=true;try{const r=await fetch(ACT,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token,password:p})}),j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'activation_failed');const{error}=await sb.auth.signInWithPassword({email:j.email,password:p});if(error)throw error;show('Acesso ativado. Abrindo seu portal...','ok');setTimeout(()=>location.replace('portal-vendedor.html'),700)}catch(e){show('Não foi possível ativar: '+e.message,'err');$('activate').disabled=false}};</script></body></html>
