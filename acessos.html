<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#087a4b"><title>PMG Comercial IA • Acessos</title><style>:root{--g:#087a4b;--gd:#075b3c;--r:#ff292d;--bg:#f5f8f6;--card:#fff;--ink:#172019;--m:#718078;--l:#dfe8e2;--soft:#eaf7ef;--warn:#fff4df;--danger:#fff0f1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}.hidden{display:none!important}.shell{max-width:980px;margin:auto;padding:18px 16px 50px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.brand{display:flex;align-items:center;gap:11px}.logo{width:48px;height:48px;border-radius:14px;background:linear-gradient(145deg,var(--g),var(--gd));color:#fff;display:grid;place-items:center;font-weight:950}.brand small{display:block;color:var(--m);margin-top:2px}.actions{display:flex;gap:8px}.btn{border:0;border-radius:12px;padding:10px 13px;font-weight:850;cursor:pointer}.pri{background:var(--g);color:#fff}.soft{background:var(--soft);color:var(--gd)}.ghost{background:#fff;border:1px solid var(--l);color:var(--ink)}.hero{background:linear-gradient(135deg,#0a7447,#075b3c);color:#fff;border-radius:24px;padding:23px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;right:-60px;bottom:-90px;width:240px;height:210px;background:linear-gradient(135deg,transparent 51%,#fff 51% 55%,var(--r) 55%)}.ey{font-size:10px;text-transform:uppercase;letter-spacing:.14em;font-weight:900;color:#9ee0b8}.hero h1{font-size:29px;margin:7px 0;position:relative;z-index:2}.hero p{color:#d9f0e2;line-height:1.5;position:relative;z-index:2;max-width:720px}.notice{margin:14px 0;border-radius:15px;padding:13px;background:var(--warn);color:#755113;font-size:11px;line-height:1.5}.notice.error{background:var(--danger);color:#a31d28}.section{margin-top:18px}.sectionHead{display:flex;align-items:end;justify-content:space-between;gap:10px;margin-bottom:10px}.section h2{font-size:21px;margin:3px 0}.list{display:grid;gap:9px}.seller{background:#fff;border:1px solid var(--l);border-radius:17px;padding:14px}.row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.tag{display:inline-flex;border-radius:999px;padding:4px 8px;font-size:9px;font-weight:900;background:#f1f4f2;color:#637168}.tag.ok{background:var(--soft);color:var(--g)}.meta{font-size:10px;color:var(--m);line-height:1.45;margin-top:4px}.invite{margin-top:12px;padding-top:12px;border-top:1px solid var(--l)}.inviteRow{display:grid;grid-template-columns:1fr auto;gap:8px}.inviteRow input{border:1px solid var(--l);border-radius:11px;padding:10px}.msg{margin-top:8px;padding:9px 10px;border-radius:10px;background:#f1f4f2;color:var(--m);font-size:10px;line-height:1.45}.msg.err{background:var(--danger);color:#a31d28}.msg.ok{background:var(--soft);color:var(--g)}.link{margin-top:8px;border:1px dashed #c9d8cf;border-radius:11px;padding:10px;font-size:10px;word-break:break-all}.empty{padding:18px;border:1px dashed #cfdcd4;border-radius:14px;text-align:center;color:var(--m);background:#fbfdfb;font-size:11px}@media(max-width:650px){.top{align-items:flex-start}.actions{display:grid}.inviteRow{grid-template-columns:1fr}.hero h1{font-size:25px}}</style></head><body><main id="app" class="shell hidden"><header class="top"><div class="brand"><div class="logo">PMG</div><div><strong>PMG Comercial IA</strong><small id="adminLabel">Acessos da equipe</small></div></div><div class="actions"><button class="btn soft" onclick="location.href='gestao.html'">← Gestão</button><button class="btn ghost" id="refresh">Atualizar</button></div></header><section class="hero"><div class="ey">Administração</div><h1>Cadastro comercial primeiro. Acesso depois.</h1><p>O vendedor deve existir no cadastro comercial antes de receber um convite de login. O acesso é individual e não concede permissões administrativas.</p></section><div id="warning" class="notice hidden"></div><section class="section"><div class="sectionHead"><div><div class="ey" style="color:#6d8978">Equipe</div><h2>Vendedores cadastrados</h2></div><button class="btn pri" id="newSeller">Cadastrar vendedor</button></div><div id="sellerList" class="list"></div></section></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.0';const URL='https://mvlnnerolwabvdgbpntz.supabase.co',KEY='sb_publishable_oS7vr5cb4w5TQJaiZ0jJ9w_IX9Q21SY',sb=createClient(URL,KEY),$=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let profile;function warning(t,error=false){$('warning').textContent=t;$('warning').className='notice'+(error?' error':'')}function imsg(el,t,c=''){el.textContent=t;el.className='msg '+c}async function auth(){const{data:{session}}=await sb.auth.getSession();if(!session){location.replace('app.html');return false}const{data:p}=await sb.from('profiles').select('full_name,role,active').eq('id',session.user.id).single();if(!p?.active||!['admin','supervisor'].includes(p.role)){location.replace('app.html');return false}profile=p;$('adminLabel').textContent=(p.full_name||'Gestor')+' • '+p.role;$('app').classList.remove('hidden');return true}async function fallbackSellers(){const r=await sb.from('sellers').select('id,display_name,seller_code,active,user_id').eq('active',true).order('seller_code');if(r.error)return{data:[],error:r.error};return{data:(r.data||[]).map(s=>({seller_id:s.id,seller_name:s.display_name,seller_code:s.seller_code,has_access:!!s.user_id,access_email:null})),error:null}}async function load(){warning('Carregando acessos...');let r=await sb.rpc('admin_list_seller_access');if(r.error){const fb=await fallbackSellers();if(fb.error){warning('Não foi possível carregar os vendedores. '+fb.error.message,true);$('sellerList').innerHTML='';return}r={data:fb.data,error:null};warning('A lista de vendedores foi carregada por modo seguro de compatibilidade. A consulta detalhada de access_grants ainda precisa de correção no backend.');}else $('warning').classList.add('hidden');render(r.data||[])}function render(data){if(!data.length){$('sellerList').innerHTML='<div class="empty">Nenhum vendedor comercial cadastrado ainda.</div>';return}$('sellerList').innerHTML='';for(const s of data){const d=document.createElement('article');d.className='seller';d.innerHTML=`<div class="row"><div><strong>${esc(s.seller_name||'Vendedor')}</strong><div class="meta">${s.seller_code?'Código '+esc(s.seller_code):'Sem código PMG'}${s.access_email?' • '+esc(s.access_email):''}</div></div><span class="tag ${s.has_access?'ok':''}">${s.has_access?'ACESSO ATIVO':'SEM ACESSO'}</span></div>`;if(!s.has_access){const b=document.createElement('div');b.className='invite';b.innerHTML=`<div class="inviteRow"><input type="email" placeholder="E-mail de acesso do vendedor" data-email><button class="btn pri" data-create>Gerar convite</button></div><div class="msg hidden" data-msg></div><div class="link hidden" data-link></div><button class="btn soft hidden" style="margin-top:8px" data-copy>Copiar link</button>`;d.appendChild(b);const email=b.querySelector('[data-email]'),create=b.querySelector('[data-create]'),msg=b.querySelector('[data-msg]'),link=b.querySelector('[data-link]'),copy=b.querySelector('[data-copy]');create.onclick=async()=>{const e=email.value.trim().toLowerCase();if(!e.includes('@'))return imsg(msg,'Informe um e-mail válido.','err');create.disabled=true;const rr=await sb.rpc('admin_create_seller_invite',{p_seller_id:s.seller_id,p_email:e,p_valid_hours:168});create.disabled=false;if(rr.error)return imsg(msg,'Não foi possível gerar o convite: '+rr.error.message,'err');const token=rr.data?.[0]?.invite_token;if(!token)return imsg(msg,'O backend não retornou o token do convite.','err');const u=new URL('ativar-vendedor.html',location.href);u.search='?invite='+encodeURIComponent(token);link.textContent=u.href;link.classList.remove('hidden');copy.classList.remove('hidden');imsg(msg,'Convite criado com validade de 7 dias.','ok');copy.onclick=async()=>{await navigator.clipboard.writeText(u.href);copy.textContent='Link copiado ✓'}}} $('sellerList').appendChild(d)}}$('refresh').onclick=load;$('newSeller').onclick=()=>location.href='vendedores.html';if(await auth())await load();</script></body></html>
