<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#087a4b"><title>PMG Comercial IA • Corrigir pedido</title><script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script><style>:root{--g:#087a4b;--gd:#075b3c;--gs:#eaf7ef;--r:#ff2c32;--bg:#f5f8f6;--i:#172019;--m:#718078;--l:#dfe8e2;--warn:#fff4e7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--i);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}.ico{width:20px;height:20px}.shell{max-width:950px;margin:auto;padding-bottom:88px}.top{height:75px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:rgba(245,248,246,.95);backdrop-filter:blur(16px);z-index:20}.brand{display:flex;align-items:center;gap:11px}.logo{width:50px;height:50px}.logo svg{width:100%;height:100%}.brand small{display:block;color:var(--m);margin-top:2px}.back{width:42px;height:42px;border:1px solid var(--l);background:#fff;border-radius:13px;color:var(--g);display:grid;place-items:center}.main{padding:0 14px 24px}.card{background:#fff;border:1px solid var(--l);border-radius:19px;padding:16px;margin-top:10px}.ey{font-size:10px;text-transform:uppercase;letter-spacing:.14em;font-weight:900;color:#6a8774}.card h1{font-size:28px;margin:7px 0}.notice{background:var(--warn);color:#85520e;border-radius:13px;padding:11px;font-size:11px;line-height:1.5}.items{display:grid;gap:8px;margin-top:12px}.item{border:1px solid var(--l);border-radius:14px;padding:12px}.row{display:flex;justify-content:space-between;gap:10px}.code{display:inline-flex;padding:4px 7px;border-radius:99px;background:var(--gs);color:var(--g);font-size:9px;font-weight:900}.item h3{font-size:12px;margin:7px 0 4px}.meta{font-size:9px;color:var(--m);line-height:1.5}.edit{display:grid;grid-template-columns:1fr 1fr auto;gap:7px;margin-top:9px}.edit input{width:100%;border:1px solid var(--l);border-radius:10px;padding:9px}.btn{border:0;border-radius:13px;padding:10px 12px;font-weight:850;display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer}.pri{background:linear-gradient(90deg,#09934f,var(--g));color:#fff}.soft{background:var(--gs);color:var(--gd)}.remove{background:#fff0f1;color:#a51c28}.tools{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1px solid var(--l);padding-top:12px;margin-top:12px}.total small{display:block;color:var(--m);font-size:9px}.total strong{display:block;font-size:22px;margin-top:2px}.addbox{background:#f8fbf9;border:1px dashed #cbd9cf;border-radius:14px;padding:12px;margin-top:12px}.search{display:flex;gap:7px}.search input{flex:1;border:1px solid var(--l);border-radius:11px;padding:10px}.results{display:grid;gap:7px;margin-top:8px}.result{border:1px solid var(--l);border-radius:12px;padding:10px;display:flex;justify-content:space-between;gap:9px;align-items:center}.msg{padding:10px 12px;border-radius:12px;background:#f0f4f1;color:var(--m);font-size:10px;margin-top:9px}.err{background:#fff0f1;color:#a51c28}.ok{background:#e7f8ef;color:#087447}.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(950px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:rgba(6,91,60,.98);padding:7px 4px calc(7px + env(safe-area-inset-bottom));z-index:30}.nav button{border:0;background:transparent;color:#cfe7d8;padding:5px 2px;font-size:9px;font-weight:800;border-radius:11px}.nav .ico{display:block;margin:0 auto 3px}.nav .active{color:#fff;background:rgba(255,255,255,.12)}@media(max-width:650px){.edit{grid-template-columns:1fr 1fr}.edit .remove{grid-column:1/-1}.row{flex-direction:column}.search{display:grid}}</style></head><body><main class="shell"><header class="top"><div class="brand"><div class="logo" data-logo></div><div><strong>PMG Comercial IA</strong><small>Correção do pedido</small></div></div><button class="back" id="back"><i data-lucide="arrow-left" class="ico"></i></button></header><div class="main"><section id="main" class="card">Carregando...</section></div><nav class="nav"><button onclick="location.href='vendedor-v2.html'"><i data-lucide="house" class="ico"></i>Início</button><button onclick="location.href='vendedor-ia-v2.html'"><i data-lucide="sparkles" class="ico"></i>IA</button><button onclick="location.href='vendedor-crm-v2.html'"><i data-lucide="columns-3" class="ico"></i>CRM</button><button class="active" onclick="location.href='vendedor-pedidos-v2.html'"><i data-lucide="shopping-cart" class="ico"></i>Pedidos</button><button onclick="location.href='vendedor-whatsapp-v2.html'"><i data-lucide="message-circle" class="ico"></i>WhatsApp</button></nav></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.0';const U='https://mvlnnerolwabvdgbpntz.supabase.co',K='sb_publishable_oS7vr5cb4w5TQJaiZ0jJ9w_IX9Q21SY',sb=createClient(U,K),$=x=>document.getElementById(x),id=new URLSearchParams(location.search).get('id'),money=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(n||0)),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),logo=`<svg viewBox="0 0 100 100"><rect x="2" y="2" width="96" height="96" rx="18" fill="#fff" stroke="#111" stroke-width="1.4"/><path d="M5 5h72L5 77z" fill="#ff2c32"/><path d="M95 95H25l70-70z" fill="#008846"/><path d="M2 83L83 2l15 15-81 81z" fill="#fff"/><text x="17" y="78" font-size="23" font-weight="900" font-family="Arial" transform="rotate(-45 17 78)">P</text><text x="47" y="53" font-size="23" font-weight="900" font-family="Arial" transform="rotate(-45 47 53)">M</text><text x="73" y="27" font-size="20" font-weight="900" font-family="Arial" transform="rotate(-45 73 27)">G</text></svg>`;document.querySelectorAll('[data-logo]').forEach(x=>x.innerHTML=logo);let order,customer,validation,items=[];const icons=()=>lucide?.createIcons();async function boot(){const{data:{session}}=await sb.auth.getSession();if(!session)return location.href='vendedor-v2.html';if(!id)return $('main').textContent='Pedido não informado.';const{data:o,error}=await sb.from('orders').select('*').eq('id',id).single();if(error||o.status!=='draft')return $('main').textContent='Este pedido não está disponível para correção.';order=o;const[{data:c},{data:i},{data:v}]=await Promise.all([sb.from('customers').select('trade_name,legal_name').eq('id',o.customer_id).single(),sb.from('order_items').select('*').eq('order_id',id).order('created_at'),sb.from('order_customer_validations').select('*').eq('order_id',id).order('created_at',{ascending:false}).limit(1)]);customer=c;validation=v?.[0];for(const x of i||[]){const{data:s}=await sb.rpc('search_products_for_order',{p_customer_id:o.customer_id,p_query:x.product_code_snapshot,p_limit:8});const p=(s||[]).find(z=>String(z.product_code)===String(x.product_code_snapshot));items.push({product_id:x.product_id,product_code:x.product_code_snapshot,product_name:x.product_name_snapshot,sale_unit:x.sale_unit_snapshot,quantity:Number(x.quantity),discount_pct:Number(x.seller_discount_pct||0),effective_price:Number(p?.effective_price??x.final_unit_price),max_discount_pct:Number(p?.max_discount_pct||0)})}$('back').onclick=()=>location.href='vendedor-pedido-v2.html?id='+id;render();icons()}function render(){const note=validation?.status==='revision_requested'?validation.revision_message:'';$('main').innerHTML=`<div class="ey">Pedido #${order.order_number}</div><h1>Corrigir pedido de ${esc(customer?.trade_name||customer?.legal_name||'Cliente')}</h1>${note?`<div class="notice"><strong>O cliente pediu:</strong> ${esc(note)}</div>`:''}<div id="items" class="items"></div><div class="addbox"><div class="ey">Adicionar produto</div><div class="search"><input id="q" placeholder="Código PMG, produto ou marca"><button id="searchBtn" class="btn soft"><i data-lucide="search" class="ico"></i>Buscar</button></div><div id="results" class="results"></div></div><div class="tools"><div class="total"><small>Total estimado</small><strong id="total">R$ 0,00</strong></div><button id="save" class="btn pri"><i data-lucide="save" class="ico"></i>Salvar correção</button></div><div id="msg" class="msg" style="display:none"></div>`;draw();$('searchBtn').onclick=search;$('q').addEventListener('keydown',e=>{if(e.key==='Enter')search()});$('save').onclick=save;icons()}function draw(){const box=$('items');box.innerHTML='';items.forEach((x,i)=>{const d=document.createElement('div');d.className='item';d.innerHTML=`<div class="row"><div><span class="code">Cód. ${esc(x.product_code)}</span><h3>${esc(x.product_name)}</h3><div class="meta">${esc(x.sale_unit||'')} • base atual ${money(x.effective_price)} • desconto máx. ${Number(x.max_discount_pct).toFixed(2)}%</div></div><strong>${money(x.effective_price*(1-x.discount_pct/100)*x.quantity)}</strong></div><div class="edit"><input class="qty" type="number" min="0.001" step="0.001" value="${x.quantity}"><input class="disc" type="number" min="0" max="${x.max_discount_pct}" step="0.01" value="${x.discount_pct}"><button class="btn remove">Remover</button></div>`;box.appendChild(d);d.querySelector('.qty').oninput=e=>{x.quantity=Math.max(0,Number(e.target.value||0));recalc()};d.querySelector('.disc').oninput=e=>{let v=Math.max(0,Number(e.target.value||0)),m=Number(x.max_discount_pct||0);if(v>m){v=m;e.target.value=m}x.discount_pct=v;recalc()};d.querySelector('.remove').onclick=()=>{items.splice(i,1);draw();recalc()}});recalc()}function recalc(){const t=items.reduce((s,x)=>s+Number(x.effective_price||0)*(1-Number(x.discount_pct||0)/100)*Number(x.quantity||0),0);if($('total'))$('total').textContent=money(t)}async function search(){const{data,error}=await sb.rpc('search_products_for_order',{p_customer_id:order.customer_id,p_query:$('q').value.trim(),p_limit:12});if(error)return $('results').innerHTML='<div class="msg err">Erro na busca.</div>';$('results').innerHTML=(data||[]).map((p,i)=>`<div class="result"><div><span class="code">${esc(p.product_code)}</span><div class="meta" style="margin-top:4px">${esc(p.product_name)} • ${money(p.effective_price)}</div></div><button class="btn soft add" data-i="${i}">Adicionar</button></div>`).join('')||'<div class="msg">Nenhum produto encontrado.</div>';$('results').querySelectorAll('.add').forEach(b=>b.onclick=()=>{const p=data[Number(b.dataset.i)];if(!items.some(x=>x.product_id===p.product_id))items.push({product_id:p.product_id,product_code:p.product_code,product_name:p.product_name,sale_unit:p.sale_unit,quantity:1,discount_pct:0,effective_price:Number(p.effective_price),max_discount_pct:Number(p.max_discount_pct||0)});draw();$('results').innerHTML=''});icons()}async function save(){const m=$('msg'),payload=items.filter(x=>x.quantity>0).map(x=>({product_id:x.product_id,quantity:Number(x.quantity),discount_pct:Number(x.discount_pct||0)}));m.style.display='block';if(!payload.length){m.className='msg err';m.textContent='O pedido precisa ter pelo menos um item.';return}const{error}=await sb.rpc('replace_order_from_cart',{p_order_id:id,p_items:payload});if(error){m.className='msg err';m.textContent='Não foi possível corrigir: '+error.message;return}m.className='msg ok';m.textContent='Correção salva. Preço, desconto e comissão foram revalidados no servidor.';setTimeout(()=>location.href='vendedor-pedido-v2.html?id='+id,900)}boot();icons();</script></body></html>
