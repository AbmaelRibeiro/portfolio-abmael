<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#087a4b"><title>PMG Comercial IA • Lançamento</title><script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script><style>:root{--g:#087a4b;--gd:#075b3c;--gs:#eaf7ef;--r:#ff2c32;--bg:#f5f8f6;--i:#172019;--m:#718078;--l:#dfe8e2;--orange:#9a5a11}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--i);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}.ico{width:20px;height:20px}.shell{max-width:850px;margin:auto;padding-bottom:88px}.top{height:75px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:rgba(245,248,246,.95);backdrop-filter:blur(16px);z-index:20}.brand{display:flex;align-items:center;gap:11px}.logo{width:50px;height:50px}.logo svg{width:100%;height:100%}.brand small{display:block;color:var(--m);margin-top:2px}.back{width:42px;height:42px;border:1px solid var(--l);background:#fff;border-radius:13px;color:var(--g);display:grid;place-items:center}.main{padding:0 14px 24px}.card{background:#fff;border:1px solid var(--l);border-radius:21px;padding:18px;margin-top:10px}.ey{font-size:10px;text-transform:uppercase;letter-spacing:.14em;font-weight:900;color:#6a8774}.progress{height:8px;background:#e4ece7;border-radius:99px;overflow:hidden;margin:12px 0}.bar{height:100%;background:linear-gradient(90deg,#09934f,var(--g))}.codebox{text-align:center;background:#f4f8f5;border-radius:18px;padding:22px;margin:14px 0}.codebox small{display:block;color:var(--m);font-size:10px}.code{font-size:50px;font-weight:950;letter-spacing:.04em;color:var(--g);margin:8px 0}.product{font-size:19px;font-weight:900;line-height:1.35}.details{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.detail{background:#f7f9f7;border-radius:13px;padding:12px}.detail small{display:block;color:var(--m);font-size:9px}.detail strong{display:block;font-size:17px;margin-top:3px}.actions{display:flex;gap:7px;justify-content:space-between;flex-wrap:wrap;margin-top:13px}.btn{border:0;border-radius:13px;padding:11px 13px;font-weight:850;display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer}.pri{background:linear-gradient(90deg,#09934f,var(--g));color:#fff}.soft{background:var(--gs);color:var(--gd)}.orange{background:#fff3df;color:#8d5811}.field{display:grid;gap:6px;margin-top:12px}.field label{font-size:10px;font-weight:850;color:var(--m)}.field input{width:100%;border:1px solid var(--l);border-radius:12px;padding:11px}.msg{padding:10px 12px;border-radius:12px;background:#f0f4f1;color:var(--m);font-size:10px;margin-top:9px}.err{background:#fff0f1;color:#a51c28}.ok{background:#e7f8ef;color:#087447}.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(850px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:rgba(6,91,60,.98);padding:7px 4px calc(7px + env(safe-area-inset-bottom));z-index:30}.nav button{border:0;background:transparent;color:#cfe7d8;padding:5px 2px;font-size:9px;font-weight:800;border-radius:11px}.nav .ico{display:block;margin:0 auto 3px}.nav .active{color:#fff;background:rgba(255,255,255,.12)}@media(max-width:650px){.details{grid-template-columns:1fr}.code{font-size:40px}.actions .btn{flex:1}}</style></head><body><main class="shell"><header class="top"><div class="brand"><div class="logo" data-logo></div><div><strong>PMG Comercial IA</strong><small>Modo lançamento</small></div></div><button class="back" id="back"><i data-lucide="arrow-left" class="ico"></i></button></header><div class="main"><section id="card" class="card">Carregando pedido...</section></div><nav class="nav"><button onclick="location.href='vendedor-v2.html'"><i data-lucide="house" class="ico"></i>Início</button><button onclick="location.href='vendedor-ia-v2.html'"><i data-lucide="sparkles" class="ico"></i>IA</button><button onclick="location.href='vendedor-crm-v2.html'"><i data-lucide="columns-3" class="ico"></i>CRM</button><button class="active" onclick="location.href='vendedor-pedidos-v2.html'"><i data-lucide="shopping-cart" class="ico"></i>Pedidos</button><button onclick="location.href='vendedor-whatsapp-v2.html'"><i data-lucide="message-circle" class="ico"></i>WhatsApp</button></nav></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.0';const U='https://mvlnnerolwabvdgbpntz.supabase.co',K='sb_publishable_oS7vr5cb4w5TQJaiZ0jJ9w_IX9Q21SY',sb=createClient(U,K),$=x=>document.getElementById(x),id=new URLSearchParams(location.search).get('id'),money=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(n||0)),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),logo=`<svg viewBox="0 0 100 100"><rect x="2" y="2" width="96" height="96" rx="18" fill="#fff" stroke="#111" stroke-width="1.4"/><path d="M5 5h72L5 77z" fill="#ff2c32"/><path d="M95 95H25l70-70z" fill="#008846"/><path d="M2 83L83 2l15 15-81 81z" fill="#fff"/><text x="17" y="78" font-size="23" font-weight="900" font-family="Arial" transform="rotate(-45 17 78)">P</text><text x="47" y="53" font-size="23" font-weight="900" font-family="Arial" transform="rotate(-45 47 53)">M</text><text x="73" y="27" font-size="20" font-weight="900" font-family="Arial" transform="rotate(-45 73 27)">G</text></svg>`;document.querySelectorAll('[data-logo]').forEach(x=>x.innerHTML=logo);let order,items=[],idx=0;const icons=()=>lucide?.createIcons();async function boot(){const{data:{session}}=await sb.auth.getSession();if(!session)return location.href='vendedor-v2.html';if(!id)return $('card').textContent='Pedido não informado.';let{data:o,error}=await sb.from('orders').select('*').eq('id',id).single();if(error)return $('card').textContent='Pedido não encontrado.';order=o;if(order.status==='approved'){const{error:e}=await sb.rpc('start_order_launch',{p_order_id:id});if(e)return $('card').innerHTML='<div class="msg err">Não foi possível iniciar: '+esc(e.message)+'</div>';const r=await sb.from('orders').select('*').eq('id',id).single();order=r.data}if(order.status==='finalized'){return $('card').innerHTML=`<div class="ey">Pedido #${order.order_number}</div><h2>Venda já finalizada.</h2><button class="btn soft" onclick="location.href='vendedor-pedido-v2.html?id=${id}'">Ver pedido</button>`}if(order.status!=='launching')return $('card').innerHTML='<div class="msg err">Este pedido ainda não está aprovado pelo cliente para lançamento.</div>';const{data:i}=await sb.from('order_items').select('*').eq('order_id',id).order('created_at');items=i||[];$('back').onclick=()=>location.href='vendedor-pedido-v2.html?id='+id;render();icons()}function render(){if(!items.length)return $('card').textContent='Pedido sem itens.';if(idx>=items.length)return finishView();const x=items[idx],pct=Math.round((idx+1)/items.length*100);$('card').innerHTML=`<div class="ey">Pedido #${order.order_number} • Item ${idx+1} de ${items.length}</div><div class="progress"><div class="bar" style="width:${pct}%"></div></div><div class="codebox"><small>CÓDIGO PMG</small><div class="code">${esc(x.product_code_snapshot)}</div><div class="product">${esc(x.product_name_snapshot)}</div></div><div class="details"><div class="detail"><small>Quantidade</small><strong>${Number(x.quantity).toLocaleString('pt-BR')} ${esc(x.sale_unit_snapshot||'')}</strong></div><div class="detail"><small>Preço unitário</small><strong>${money(x.final_unit_price)}</strong></div><div class="detail"><small>Subtotal</small><strong>${money(x.line_total)}</strong></div></div><div class="actions"><button id="prev" class="btn soft" ${idx===0?'disabled':''}><i data-lucide="arrow-left" class="ico"></i>Anterior</button><button id="copy" class="btn pri"><i data-lucide="copy" class="ico"></i>Copiar código</button><button id="next" class="btn orange">${idx===items.length-1?'Concluir itens':'Próximo'}<i data-lucide="arrow-right" class="ico"></i></button></div><div id="msg" class="msg" style="display:none"></div>`;$('prev').onclick=()=>{idx--;render()};$('next').onclick=()=>{idx++;render()};$('copy').onclick=async()=>{await navigator.clipboard.writeText(x.product_code_snapshot);const m=$('msg');m.style.display='block';m.className='msg ok';m.textContent='Código '+x.product_code_snapshot+' copiado.'};icons()}function finishView(){$('card').innerHTML=`<div class="ey">Pedido #${order.order_number} • Todos os itens revisados</div><h2 style="font-size:27px;margin:7px 0">Lançamento concluído?</h2><p style="color:var(--m);line-height:1.5">Confirme somente depois de lançar códigos, quantidades e preços no sistema oficial da PMG.</p><div class="field"><label>Nº / referência no sistema PMG (opcional)</label><input id="ref" value="${esc(order.external_reference||'')}" placeholder="Ex.: 458721"></div><div class="details" style="margin-top:12px"><div class="detail"><small>Total</small><strong>${money(order.net_amount)}</strong></div><div class="detail"><small>Comissão</small><strong>${money(order.commission_forecast)}</strong></div><div class="detail"><small>Itens</small><strong>${items.length}</strong></div></div><div class="actions"><button id="again" class="btn soft"><i data-lucide="rotate-ccw" class="ico"></i>Rever itens</button><button id="finalize" class="btn pri"><i data-lucide="check-circle" class="ico"></i>Finalizar venda</button></div><div id="msg" class="msg" style="display:none"></div>`;$('again').onclick=()=>{idx=0;render()};$('finalize').onclick=finish;icons()}async function finish(){const b=$('finalize'),m=$('msg'),ref=$('ref').value.trim();b.disabled=true;m.style.display='block';if(ref){const{error:e}=await sb.rpc('set_order_external_reference',{p_order_id:id,p_external_reference:ref});if(e){m.className='msg err';m.textContent='Não foi possível salvar a referência: '+e.message;b.disabled=false;return}}const{error}=await sb.rpc('finalize_order',{p_order_id:id});if(error){m.className='msg err';m.textContent='Não foi possível finalizar: '+error.message;b.disabled=false;return}m.className='msg ok';m.textContent='Venda finalizada. Comissão confirmada e CRM atualizado.';setTimeout(()=>location.href='vendedor-pedido-v2.html?id='+id,1000)}boot();icons();</script></body></html>
