os.html"><i data-lucide="user-cog" class="ico"></i><span>Acessos</span></a><a href="ia-config.html?v=16"><i data-lucide="sparkles" class="ico"></i><span>Configurar IA</span></a>';h=h.replace(old,neu);h=h.replace('</head>','<style>html{scroll-behavior:smooth}.nav a.sectionActive{background:#eaf7ef;color:#087a4b}</style></head>');h=h.replace('</body>',`<script>document.addEventListener('DOMContentLoaded',()=>{const links=[...document.querySelectorAll('.nav a[href^="#"]')],pairs=links.map(a=>[a,document.querySelector(a.getAttribute('href'))]).filter(x=>x[1]);const setActive=id=>{links.forEach(a=>a.classList.toggle('sectionActive',a.getAttribute('href')===id))};links.forEach(a=>a.addEventListener('click',()=>setActive(a.getAttribute('href'))));if('IntersectionObserver'in window){const io=new IntersectionObserver(es=>{const v=es.filter(e=>e.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];if(v)setActive('#'+v.target.id)},{rootMargin:'-18% 0px -65% 0px',threshold:[0,.1,.3,.6]});pairs.forEach(([,s])=>io.observe(s))}});<\/script></body>`);document.open();document.write(h);document.close()}catch(e){document.body.innerHTML='<div class="boot">Não foi possível carregar a Gestão. Atualize a página.</div>'}}</script></body></html>
