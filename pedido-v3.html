<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1d6b45"><title>PMG • Pedido</title><style>:root{--bg:#f5f7f4;--card:#fff;--ink:#172019;--muted:#6c766f;--line:#e1e7e2;--green:#1c7048;--green2:#e8f5ed;--orange:#9c5b13;--red:#ad2530;--blue:#315d91}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}button{font:inherit}.wrap{max-width:1050px;margin:auto;padding:22px 16px 70px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{display:flex;gap:10px;align-items:center;font-weight:900}.logo{width:43px;height:43px;border-radius:14px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:12px}.back{color:var(--green);text-decoration:none;font-weight:850}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:13px;box-shadow:0 8px 25px rgba(25,75,48,.05)}.status{display:inline-flex;padding:6px 9px;border-radius:999px;background:#eef3ef;font-size:10px;font-weight:900}.status.sent{background:#edf3ff;color:#315d91}.status.approved{background:#e7f8ef;color:#087447}.status.launching{background:#fff3df;color:#8e5711}.status.finalized{background:#e5f5ea;color:#17633d}.hero{display:flex;justify-content:space-between;gap:18px}.hero h1{font-size:30px;margin:8px 0}.muted{color:var(--muted);font-size:12px;line-height:1.5}.amount{text-align:right}.amount strong{font-size:29px}.grid{display:grid;grid-template-columns:1.3fr .7fr;gap:13px}.items{display:grid;gap:8px}.item{border:1px solid var(--line);border-radius:14px;padding:13px}.row{display:flex;justify-content:space-between;gap:12px}.code{font-size:10px;color:var(--green);font-weight:900;background:var(--green2);padding:5px 8px;border-radius:999px}.item h3{font-size:14px;margin:9px 0 5px}.price{font-weight:900}.summary{display:grid;gap:8px}.sum{background:#f6f8f6;border-radius:13px;padding:12px}.sum small{display:block;color:var(--muted);font-size:10px}.sum strong{display:block;font-size:20px;margin-top:4px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{border:0;border-radius:13px;padding:12px 14px;font-weight:900;cursor:pointer;text-decoration:none}.green{background:var(--green);color:#fff}.soft{background:var(--green2);color:var(--green)}.orange{background:#fff3df;color:#8e5711}.blue{background:#edf3ff;color:#315d91}.timeline{display:grid;gap:8px}.event{border-left:3px solid #d9e4dc;padding:5px 0 5px 12px}.event strong{font-size:12px}.event span{display:block;color:var(--muted);font-size:10px;margin-top:3px}.revision{background:#fff4e7;color:#87520d;border-radius:13px;padding:12px;font-size:12px;line-height:1.45}.msg{padding:11px 13px;border-radius:12px;background:#eef3ef;color:var(--muted);font-size:11px;margin-top:10px}.ok{background:#e7f8ef;color:#087447}.err{background:#fff0f1;color:#a51c28}@media(max-width:760px){.grid{grid-template-columns:1fr}.hero{flex-direction:column}.amount{text-align:left}}</style></head><body><main class="wrap"><header class="head"><div class="brand"><div class="logo">PMG</div><div>PMG Comercial IA<div style="font-size:11px;color:var(--muted);font-weight:600">Detalhe do pedido</div></div></div><a class="back" href="pedidos-v3.html">← Central de Pedidos</a></header><section id="main" class="card">Carregando...</section></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.0';const sb=createClient('https://mvlnnerolwabvdgbpntz.supabase.co','sb_publishable_oS7vr5cb4w5TQJaiZ0jJ9w_IX9Q21SY');const $=x=>document.getElementById(x);const id=new URLSearchParams(location.search).get('id');const VALIDATION_BASE='https://raw.githack.com/AbmaelRibeiro/portfolio-abmael/pmg-homologacao/pedido-validar.html?token=';const money=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(n||0));const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const labels={draft:'Rascunho',sent:'Aguardando cliente',approved:'Aprovado pelo cliente',launching:'Em lançamento',finalized:'Finalizado',cancelled:'Cancelado'};let order,customer,seller,items=[],validation,history=[];async function boot(){const{data:{session}}=await sb.auth.getSession();if(!session){location.href='pedidos-v3.html';return}if(!id){$('main').textContent='Pedido não informado.';return}const{data:o,error}=await sb.from('orders').select('*').eq('id',id).single();if(error){$('main').textContent='Pedido não encontrado.';return}order=o;const[{data:c},{data:s},{data:i},{data:v},{data:h}]=await Promise.all([sb.from('customers').select('*').eq('id',o.customer_id).single(),sb.from('sellers').select('id,display_name').eq('id',o.seller_id).single(),sb.from('order_items').select('*').eq('order_id',id).order('created_at'),sb.from('order_customer_validations').select('*').eq('order_id',id).order('created_at',{ascending:false}).limit(1),sb.from('order_status_history').select('*').eq('order_id',id).order('created_at',{ascending:false})]);customer=c;seller=s;items=i||[];validation=v?.[0];history=h||[];render()}function render(){let action='';if(order.status==='draft'&&order.customer_validation_required)action='<button id="sendValidation" class="btn green">Enviar para cliente validar</button>';if(order.status==='sent')action='<button id="sendValidation" class="btn blue">Gerar novo link de validação</button>';if(['approved','launching'].includes(order.status))action=`<a class="btn orange" href="lancamento-v2.html?id=${order.id}">Modo lançamento PMG</a>`;let rev=validation?.status==='revision_requested'?`<div class="revision"><strong>Correção solicitada pelo cliente:</strong><br>${esc(validation.revision_message||'Sem observação.')}</div>`:'';const itemHtml=items.map(it=>`<div class="item"><div class="row"><div><span class="code">Cód. ${esc(it.product_code_snapshot)}</span><h3>${esc(it.product_name_snapshot)}</h3><div class="muted">Qtd: <strong>${Number(it.quantity).toLocaleString('pt-BR')} ${esc(it.sale_unit_snapshot||'')}</strong> • Unitário: ${money(it.final_unit_price)}${Number(it.seller_discount_pct)>0?' • Desc. '+Number(it.seller_discount_pct).toFixed(2)+'%':''}</div></div><div class="price">${money(it.line_total)}</div></div></div>`).join('');const hist=history.map(h=>`<div class="event"><strong>${labels[h.to_status]||h.to_status}</strong><span>${new Date(h.created_at).toLocaleString('pt-BR')}${h.note?' • '+esc(h.note):''}</span></div>`).join('')||'<div class="muted">Sem movimentações registradas.</div>';$('main').innerHTML=`<div class="hero"><div><span class="status ${order.status}">${labels[order.status]||order.status}</span><h1>Pedido #${order.order_number}</h1><div class="muted">Cliente: <strong>${esc(customer?.trade_name||customer?.legal_name||'Cliente')}</strong> • Vendedor: ${esc(seller?.display_name||'—')}<br>Criado em ${new Date(order.created_at).toLocaleString('pt-BR')}</div></div><div class="amount"><span class="muted">Total</span><strong>${money(order.net_amount)}</strong></div></div>${rev}<div class="actions">${action}<a class="btn soft" href="central-ia.html">✦ Abrir Central IA</a></div><div id="actionMsg" class="msg" style="display:none"></div><div class="grid" style="margin-top:14px"><div><div class="items">${itemHtml}</div></div><aside class="summary"><div class="sum"><small>Bruto</small><strong>${money(order.gross_amount)}</strong></div><div class="sum"><small>Desconto</small><strong>${money(order.discount_amount)}</strong></div><div class="sum"><small>Comissão prevista</small><strong style="color:var(--green)">${money(order.commission_forecast)}</strong></div><div class="card" style="margin:0;padding:13px"><strong style="font-size:13px">Histórico</strong><div class="timeline" style="margin-top:9px">${hist}</div></div></aside></div>`;document.getElementById('sendValidation')?.addEventListener('click',sendValidation)}async function sendValidation(){const b=document.getElementById('sendValidation');b.disabled=true;const{data:token,error}=await sb.rpc('create_order_validation',{p_order_id:order.id,p_valid_hours:48});const m=document.getElementById('actionMsg');m.style.display='block';if(error){m.className='msg err';m.textContent='Não foi possível gerar o link: '+error.message;b.disabled=false;return}const url=VALIDATION_BASE+encodeURIComponent(token);await navigator.clipboard.writeText(url);m.className='msg ok';m.innerHTML='Link de validação criado e copiado. O cliente poderá aprovar ou solicitar correção.';const phone=String(customer?.whatsapp_phone||customer?.phone||'').replace(/\D/g,'');if(phone){const text=`Olá! Seu pedido #${order.order_number} está pronto para conferência. Valide produtos, quantidades e valores aqui: ${url}`;window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(text),'_blank')}setTimeout(()=>location.reload(),900)}boot();</script></body></html>
