<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1f7a4d"><title>PMG Comercial IA</title><style>:root{--bg:#f4f6f2;--panel:#fff;--ink:#17201c;--muted:#718078;--line:#e5e9e3;--green:#1f7a4d;--soft:#e7f4eb}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}.app{display:grid;grid-template-columns:220px 1fr;height:100vh}.side{background:#fbfcfa;border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:10px;font-weight:900;padding:4px 7px 20px}.logo{width:43px;height:43px;border-radius:14px;background:linear-gradient(145deg,#1d6d46,#2e9d64);color:#fff;display:grid;place-items:center;font-size:12px}.brand small{display:block;color:var(--muted);font-weight:600;margin-top:2px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;border-radius:12px;padding:11px 12px;text-align:left;color:#5d6a62;font-weight:760;cursor:pointer;display:flex;gap:9px;align-items:center}.nav button.active{background:var(--soft);color:var(--green)}.nav i{font-style:normal;width:20px;text-align:center}.foot{margin-top:auto;border-top:1px solid var(--line);padding:14px 8px 0;color:var(--muted);font-size:11px}.frameWrap{min-width:0;height:100vh}.frame{width:100%;height:100%;border:0;background:var(--bg)}.mobile{display:none}@media(max-width:760px){.app{display:block}.side{display:none}.frameWrap{height:calc(100vh - 64px)}.mobile{display:grid;position:fixed;bottom:0;left:0;right:0;z-index:20;grid-template-columns:repeat(5,1fr);background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:7px 3px calc(7px + env(safe-area-inset-bottom));backdrop-filter:blur(14px)}.mobile button{border:0;background:transparent;color:#68756d;font-size:9px;font-weight:800}.mobile button b{display:block;font-size:17px;margin-bottom:2px}.mobile button.active{color:var(--green)}}</style></head><body><div class="app"><aside class="side"><div class="brand"><div class="logo">PMG</div><div>PMG Comercial IA<small>Gestão comercial</small></div></div><nav class="nav"><button class="active" data-page="comercial-v2.html"><i>⌂</i>Visão Geral</button><button data-page="central-ia.html"><i>✦</i>Central Comercial IA</button><button data-page="comercial-v2.html#kanban"><i>▥</i>CRM / Kanban</button><button data-page="pedidos-v3.html"><i>▤</i>Pedidos</button><button data-page="ofertas.html"><i>◆</i>Ofertas</button><button data-page="whatsapp-v2.html"><i>◉</i>WhatsApp</button></nav><div class="foot">Homologação PMG<br>Pedidos com validação do cliente</div></aside><main class="frameWrap"><iframe id="frame" class="frame" src="comercial-v2.html"></iframe></main></div><nav class="mobile"><button class="active" data-page="comercial-v2.html"><b>⌂</b>Início</button><button data-page="central-ia.html"><b>✦</b>IA</button><button data-page="comercial-v2.html#kanban"><b>▥</b>CRM</button><button data-page="pedidos-v3.html"><b>▤</b>Pedidos</button><button data-page="whatsapp-v2.html"><b>◉</b>WhatsApp</button></nav><script>const frame=document.getElementById('frame');const buttons=[...document.querySelectorAll('[data-page]')];function go(page){frame.src=page;buttons.forEach(b=>b.classList.toggle('active',b.dataset.page===page));history.replaceState({},'', '?page='+encodeURIComponent(page))}buttons.forEach(b=>b.onclick=()=>go(b.dataset.page));const initial=new URLSearchParams(location.search).get('page');if(initial)go(initial);frame.addEventListener('load',()=>{try{const d=frame.contentDocument;if(!d)return;const s=d.createElement('style');s.textContent='.sidebar,.side{display:none!important}.app,.layout{grid-template-columns:1fr!important}.main,.content{padding-left:24px!important;max-width:1500px;margin:auto}.bottom{display:none!important}@media(max-width:760px){.main,.content{padding-left:14px!important;padding-bottom:30px!important}}';d.head.appendChild(s)}catch(e){}});</script></body></html>
